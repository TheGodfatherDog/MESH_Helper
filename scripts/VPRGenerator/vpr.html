<!--
  =============================================================================
  Модуль: vpr.html
  Описание: Единый интерфейс Генератора ВПР и Редактора листов А4 (2-в-1).
  Режимы работы:
    1. По умолчанию (vpr.html): отображает панель выбора предмета, параллели,
       списка учеников и заданий (#generatorView).
    2. Режим редактора (vpr.html?mode=editor): активирует класс .mode-editor,
       отображает панель инструментов вёрстки и альбомные листы А4 (#editorView).
  =============================================================================
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор индивидуальных вариантов ВПР — МЭШ Помогатор</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        :root {
            --page-padding: 5mm;
            --font-family: 'Courier New', Courier, monospace;
            --font-size: 11pt;
            --zoom-scale: 0.82;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa; color: #1e293b; margin: 0; padding: 30px 20px;
        }

        /* Переключение режимов Генератор / Редактор */
        #editorView { display: none; }
        body.mode-editor { background: #e2e8f0; padding: 0; color: #222; }
        body.mode-editor #generatorView { display: none !important; }
        body.mode-editor #editorView { display: block !important; }

        /* Стили Генератора (Вкладка 1) */
        .vpr-card { max-width: 980px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e2e8f0; }
        .vpr-header { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; padding: 18px 28px; font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .vpr-body { padding: 24px 28px 28px; }
        .vpr-top-selectors { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: #f8fafc; padding: 16px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .vpr-grid { display: flex; gap: 28px; }
        .vpr-col { flex: 1; display: flex; flex-direction: column; }
        .vpr-label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #2e7d32; }
        .vpr-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .vpr-badge { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }
        .vpr-input, .vpr-select, .vpr-textarea { width: 100%; padding: 9px 12px; background: #fff; border: 1px solid #cbd5e1; color: #1e293b; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: .2s; }
        .vpr-input:focus, .vpr-select:focus, .vpr-textarea:focus { border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }
        .vpr-textarea { height: 210px; resize: vertical; line-height: 1.45; margin-bottom: 12px; }
        .vpr-btn-group, .vpr-task-actions { display: flex; gap: 8px; }
        .vpr-task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .vpr-mini-btn, .vpr-btn-sec { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .vpr-mini-btn { padding: 4px 10px; font-size: 11.5px; }
        .vpr-btn-sec { flex: 1; padding: 9px 12px; font-size: 13px; border-radius: 8px; }
        .vpr-mini-btn:hover, .vpr-btn-sec:hover { background: #e2e8f0; }
        .vpr-btn-clear { flex: 1; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .vpr-btn-clear:hover { background: #fee2e2; }
        .vpr-task-list { flex-grow: 1; height: 252px; overflow-y: auto; background: #f8fafc; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; }
        .vpr-task-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; cursor: pointer; user-select: none; }
        .vpr-task-item:hover { background: #e8f5e9; }
        .vpr-task-item input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: #2e7d32; cursor: pointer; flex-shrink: 0; }
        .vpr-task-title-text { flex: 1; }
        .vpr-qty-box { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 1px 3px; }
        .vpr-task-item input[type="checkbox"]:not(:checked) ~ .vpr-qty-box { opacity: 0.35; pointer-events: none; }
        .vpr-qty-btn { background: #f1f5f9; border: none; border-radius: 4px; width: 20px; height: 20px; font-weight: 700; font-size: 13px; line-height: 1; color: #334155; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        .vpr-qty-btn:hover { background: #cbd5e1; color: #0f172a; }
        .vpr-qty-input { width: 32px; height: 20px; border: none; text-align: center; font-size: 12.5px; font-weight: 700; color: #1e293b; outline: none; background: transparent; -moz-appearance: textfield; appearance: textfield; padding: 0; }
        .vpr-qty-input::-webkit-outer-spin-button, .vpr-qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .vpr-btn-main { background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(46,125,50,0.25); transition: .15s; }
        .vpr-btn-main:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.96; }
        .vpr-btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Стили Редактора А4 (Вкладка 2) */
        .toolbar { position: sticky; top: 0; z-index: 1000; background: linear-gradient(135deg, #4caf50, #2e7d32); color: #fff; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .toolbar-group { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
        .toolbar select { background: #fff; color: #1e293b; border: 1px solid rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; }
        .toolbar-check { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.18); padding: 5px 10px; border-radius: 6px; cursor: pointer; user-select: none; font-size: 12.5px; }
        .toolbar-check input { margin: 0; width: 15px; height: 15px; cursor: pointer; accent-color: #1b5e20; }
        .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
        .toolbar-overflow-warn { display: none; align-items: center; background: #dc2626; color: #fff; border: 1.5px solid #fecaca; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(220,38,38,0.45); white-space: nowrap; }
        .toolbar-overflow-warn:hover { background: #b91c1c; }
        .btn-print { background: #fff !important; color: #1b5e20 !important; border: none !important; padding: 7px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
        .viewport { padding: 32px 10px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
        .sheet-container { width: calc(297mm * var(--zoom-scale)); height: calc(210mm * var(--zoom-scale)); position: relative; margin-bottom: 18px; flex-shrink: 0; }
        .sheet-label { position: absolute; top: -22px; left: 0; color: #334155; font-size: 12px; font-weight: 700; }
        .page { background: #fff; width: 297mm !important; height: 210mm !important; min-width: 297mm !important; max-width: 297mm !important; min-height: 210mm !important; max-height: 210mm !important; box-shadow: 0 8px 25px rgba(0,0,0,0.22); padding: var(--page-padding); position: absolute; top: 0; left: 0; color: #000; font-family: var(--font-family); font-size: var(--font-size); line-height: 1.2; transform-origin: top left; transform: scale(var(--zoom-scale)); overflow: hidden; }
        .overflow-badge { display: none; position: absolute; bottom: 4px; right: 8px; background: #dc2626; color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-family: sans-serif; font-weight: bold; z-index: 500; }
        .one-column-mode { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
        .two-columns-mode { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); column-gap: calc(var(--page-padding) * 1.6); }
        .column-block { position: relative; width: 100%; height: 100%; min-height: 0; max-height: 100%; overflow: hidden; }
        .variant-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid #000; padding-bottom: 2px; margin-bottom: 4px; font-weight: bold; line-height: 1.15; }
        .variant-left { font-size: 1.02em; }
        .variant-right { font-size: 0.88em; }
        .task-block { margin-bottom: 4px; break-inside: avoid; }
        .task-title { font-weight: bold; margin-bottom: 2px; display: flex; gap: 6px; align-items: baseline; line-height: 1.18; }
        @keyframes tcPulseNum { 0%, 72%, 100% { opacity: 1; } 78%, 94% { opacity: 0; } }
        @keyframes tcPulseIcon { 0%, 72%, 100% { opacity: 0; } 78%, 94% { opacity: 1; } }
        @keyframes tcSpin { to { transform: rotate(360deg); } }
        .task-circle { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 1.3em; height: 1.3em; font-size: 1.15em; line-height: 1; flex-shrink: 0; user-select: none; cursor: pointer; }
        .task-circle .tc-num { animation: tcPulseNum 4s infinite; transition: opacity .15s; }
        .task-circle .tc-icon { position: absolute; font-size: 0.8em; opacity: 0; animation: tcPulseIcon 4s infinite; transition: opacity .15s, transform .15s; }
        .task-circle:hover .tc-num, .task-circle.is-loading .tc-num { opacity: 0 !important; animation: none !important; }
        .task-circle:hover .tc-icon { opacity: 1 !important; animation: none !important; transform: scale(1.15); }
        .task-circle.is-loading .tc-icon { opacity: 1 !important; animation: tcSpin .6s linear infinite !important; }
        .task-body { margin-left: 18px; line-height: 1.18; }
        .task-line { margin-bottom: 1px; word-break: break-word; }
        .task-line-with-table { margin-bottom: 2px; line-height: 1.2; }
        .task-line-text { display: inline; }
        .variants-inline-flow { margin: 2px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 12px; line-height: 1.2; }
        .variant-chip { white-space: nowrap; display: inline-flex; gap: 4px; }
        .last-variant-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
        .inline-answer { font-weight: bold; white-space: nowrap; margin-left: 10px; }
        .answer-line { margin-top: 2px; font-weight: bold; line-height: 1.18; }
        .answer-grid { border-collapse: collapse; margin: 1px 0 1px 8px; display: inline-table; vertical-align: middle; }
        .answer-grid td { border: 1px solid #000; min-width: 22px; height: 17px; padding: 0 3px; text-align: center; font-size: 0.82em; }
        .answer-grid tr:first-child td { font-weight: bold; background: #f2f2f2; }
        .keys-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.88em; }
        .keys-table th, .keys-table td { border: 1px solid #000; padding: 4px 5px; text-align: center; }
        .keys-table th { background: #f2f2f2; }
        .keys-table td:nth-child(2) { text-align: left; }

        @media print {
            html, body { width: 297mm !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
            #generatorView, .toolbar, .sheet-label, .overflow-badge { display: none !important; }
            .task-circle .tc-num { opacity: 1 !important; animation: none !important; }
            .task-circle .tc-icon { display: none !important; }
            .viewport { display: block !important; padding: 0 !important; margin: 0 !important; }
            .sheet-container { width: 297mm !important; height: 210mm !important; margin: 0 !important; padding: 0 !important; page-break-after: always !important; break-after: page !important; overflow: hidden !important; }
            .sheet-container:last-child { page-break-after: auto !important; break-after: auto !important; }
            .page { position: relative !important; box-shadow: none !important; margin: 0 !important; width: 297mm !important; height: 210mm !important; transform: none !important; }
            @page { size: 297mm 210mm; margin: 0; }
        }
    </style>
</head>
<body>
    <!-- РЕЖИМ 1: НАСТРОЙКА И ГЕНЕРАЦИЯ ВАРИАНТОВ -->
    <div id="generatorView">
        <div class="vpr-card">
            <div class="vpr-header">
                <span>🖨️ Генератор индивидуальных вариантов ВПР</span>
                <span style="font-size: 13px; font-weight: 500; opacity: 0.9;">✨ МЭШ Помогатор</span>
            </div>
            <div class="vpr-body">
                <div class="vpr-top-selectors">
                    <div>
                        <label class="vpr-label" for="subjectSelector">Выберите предмет:</label>
                        <select id="subjectSelector" class="vpr-select"></select>
                    </div>
                    <div>
                        <label class="vpr-label" for="classSelector">Выберите параллель:</label>
                        <select id="classSelector" class="vpr-select"></select>
                    </div>
                </div>
                <div class="vpr-grid">
                    <div class="vpr-col">
                        <div style="margin-bottom: 14px;">
                            <label class="vpr-label" for="className">Название класса:</label>
                            <input type="text" id="className" class="vpr-input" value="7-1">
                        </div>
                        <div class="vpr-label-row">
                            <label class="vpr-label" for="studentsList" style="margin: 0;">Список учеников:</label>
                            <span id="countBadge" class="vpr-badge">3 уч.</span>
                        </div>
                        <textarea id="studentsList" class="vpr-textarea">Храмцов Андрей&#10;Перхурова Екатерина&#10;Елькина Милина&#10;Яцкевич Арина</textarea>
                        <div class="vpr-btn-group">
                            <button type="button" id="pasteBtn" class="vpr-btn-sec">📋 Вставить</button>
                            <button type="button" id="clearBtn" class="vpr-btn-clear">🗑 Очистить</button>
                        </div>
                    </div>
                    <div class="vpr-col">
                        <div class="vpr-task-header">
                            <label class="vpr-label" style="margin: 0;">Выбор заданий:</label>
                            <div class="vpr-task-actions">
                                <select id="bulkQtySelect" class="vpr-mini-btn" title="Установить количество всем отмеченным заданиям" style="outline: none;">
                                    <option value="" selected disabled>По N шт...</option>
                                    <option value="1">Всем по 1 шт.</option>
                                    <option value="2">Всем по 2 шт.</option>
                                    <option value="3">Всем по 3 шт.</option>
                                    <option value="5">Всем по 5 шт.</option>
                                    <option value="10">Всем по 10 шт.</option>
                                </select>
                                <button type="button" id="selectAllBtn" class="vpr-mini-btn">Выбрать все</button>
                                <button type="button" id="deselectAllBtn" class="vpr-mini-btn">Снять все</button>
                            </div>
                        </div>
                        <div id="tasksContainer" class="vpr-task-list">
                            <div style="color: #64748b; padding: 10px;">⏳ Сканирование папки заданий...</div>
                        </div>
                        <button type="button" class="vpr-btn-main" id="genBtn">✨ Сгенерировать варианты</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- РЕЖИМ 2: РЕДАКТОР ЛИСТОВ А4 И ПЕЧАТЬ (?mode=editor) -->
    <div id="editorView">
        <div class="toolbar">
            <div class="toolbar-group">
                <label for="fontFamilySelect">Шрифт:</label>
                <select id="fontFamilySelect">
                    <option value="'Courier New', Courier, monospace" selected>Courier New</option>
                    <option value="'Times New Roman', Times, serif">Times New Roman</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="Calibri, sans-serif">Calibri</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="fontSizeSelect">Кегль:</label>
                <select id="fontSizeSelect">
                    <option value="6pt">6 пт</option>
                    <option value="7pt">7 пт</option>
                    <option value="8pt">8 пт</option>
                    <option value="9pt">9 пт</option>
                    <option value="10pt">10 пт</option>
                    <option value="11pt" selected>11 пт</option>
                    <option value="12pt">12 пт</option>
                    <option value="13pt">13 пт</option>
                    <option value="14pt">14 пт</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label for="marginsSelect">Поля:</label>
                <select id="marginsSelect">
                    <option value="1mm">0.1 см</option>
                    <option value="5mm" selected>0.5 см</option>
                    <option value="10mm">1.0 см</option>
                    <option value="15mm">1.5 см</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label class="toolbar-check">
                    <input type="checkbox" id="twoColumnsCheckbox" checked>
                    <span>В два столбца (2 ученика на лист)</span>
                </label>
            </div>
            <div class="toolbar-group">
                <label class="toolbar-check">
                    <input type="checkbox" id="duplexCheckbox" checked>
                    <span>🖨️ Двусторонняя печать (перенос на оборот)</span>
                </label>
            </div>
            <div class="toolbar-group">
                <label for="zoomSelect">Масштаб:</label>
                <select id="zoomSelect">
                    <option value="fit">По ширине</option>
                    <option value="0.65">65%</option>
                    <option value="0.82" selected>82%</option>
                    <option value="1.0">100%</option>
                </select>
            </div>
            <div class="toolbar-right">
                <div id="toolbarOverflowWarn" class="toolbar-overflow-warn"></div>
                <button type="button" id="printBtn" class="btn-print">🖨️ Печать</button>
            </div>
        </div>
        <div class="viewport" id="viewportArea"></div>
    </div>

    <iframe id="pythonSandboxFrame" src="pythonSandbox.html" style="display: none;"></iframe>
    <script src="vpr.js"></script>
</body>
</html>
